spring:
  application:
    name: fsd-core-server
  datasource:
    # SEC-12 fix: useSSL=true so MySQL connections use TLS. verifyServerCertificate is
    # false by default to avoid requiring CA setup in dev; production deployments should
    # set DB_SSL_MODE=VERIFY_IDENTITY and provide a truststore.
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:fsd_core}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=utf8mb4&connectionCollation=utf8mb4_general_ci&serverTimezone=${DB_TIMEZONE:Asia/Shanghai}&useSSL=${DB_USE_SSL:true}&requireSSL=${DB_REQUIRE_SSL:false}&verifyServerCertificate=${DB_VERIFY_SERVER_CERT:false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      database: ${REDIS_DATABASE:0}
      # SEC-10 fix: Redis password is now required by default. Set REDIS_PASSWORD to
      # an empty string only for trusted local dev environments.
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:3s}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5673}
    # SEC-11 fix: default credentials are placeholders. Production MUST override via env.
    username: ${RABBITMQ_USERNAME:fsd_user}
    password: ${RABBITMQ_PASSWORD:changeme}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 20
    baseline-description: Pre-Flyway migrations V01-V20
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  lifecycle:
    timeout-per-shutdown-phase: ${SERVER_SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: ${SERVER_SHUTDOWN:immediate}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE_INCLUDE:health,prometheus,metrics}
      base-path: /internal/actuator
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

fsd:
  mobile-order:
    require-api-key: ${MOBILE_ORDER_REQUIRE_KEY:true}
  park:
    enabled: ${FSD_PARK_ENABLED:true}
    default-park-code: ${FSD_PARK_DEFAULT_CODE:DEFAULT}
    width: ${FSD_PARK_WIDTH:1600}
    height: ${FSD_PARK_HEIGHT:1854}
    min-zoom: ${FSD_PARK_MIN_ZOOM:-1}
    max-zoom: ${FSD_PARK_MAX_ZOOM:3}
    vehicle-speed-px-per-second: ${FSD_PARK_VEHICLE_SPEED_PX_PER_SECOND:8}
    # ALG-A* / T-05：路网寻路算法开关与启发权重
    route-plan:
      # A* 开关；关闭后回退 Dijkstra。图内节点 GPS 覆盖不一致时也会自动回退（h 不可采纳）
      a-star-enabled: ${FSD_PARK_ROUTE_PLAN_ASTAR_ENABLED:true}
      # 启发权重 w：1.0 = 标准 A*（保证最优）；>1 = 加权 A*（代价上界 w×最优，换取更小搜索规模）
      a-star-weight: ${FSD_PARK_ROUTE_PLAN_ASTAR_WEIGHT:1.0}
      # 路网图进程内缓存存活时间；<=0 回退到每次全量重查（修复前行为，仅作回滚开关）
      graph-cache-ttl-ms: ${FSD_PARK_ROUTE_PLAN_GRAPH_CACHE_TTL_MS:60000}
    geo:
      enabled: ${FSD_PARK_GEO_ENABLED:true}
      osm-geo-path: ${FSD_PILOT_OSM_GEO_PATH:../../data/pilot_osm_geo.json}
      anchor-lng: ${FSD_PARK_GEO_ANCHOR_LNG:121.0932364}
      anchor-lat: ${FSD_PARK_GEO_ANCHOR_LAT:31.9373442}
      park-width-meters: ${FSD_PARK_GEO_WIDTH_M:7957.7}
      park-height-meters: ${FSD_PARK_GEO_HEIGHT_M:9221.0}
      scenario: ${FSD_PARK_GEO_SCENARIO:ZJF_DIESHIQIAO_PILOT}
      # §范围补齐：画布与参考点由 scripts/geo/osm_to_road_graph.py 的 fit_canvas 反解
      # （data/map.corridor.osm 在走廊框 31.8994,121.0487,31.9793,121.1288 内的节点 GCJ 外接框
      #  → 米制各向同性画布 1600x1854，0 节点越界）。4 个参考点全落在同一线性映射
      #  x=(lng-X0)*SX / y=(Y0-lat)*SY 上，故 resolveAffine 精确还原，
      #  与 zjf_road_network.sql 的 coord_x/coord_y 同源。产物见 docs/park_transform_params_2026-09-23.txt。
      reference-points:
        - x: 40
          y: 40
          lng: 121.0532242
          lat: 31.9769738
        - x: 1560
          y: 40
          lng: 121.1332486
          lat: 31.9769738
        - x: 40
          y: 1814
          lng: 121.0532242
          lat: 31.8977147
        - x: 1560
          y: 1814
          lng: 121.1332486
          lat: 31.8977147
